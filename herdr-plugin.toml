id = "devlomingo.herdr-fork"
name = "herdr-fork"
version = "0.2.0"
description = "Fork any coding agent's conversation from any message, into a new herdr pane."
platforms = ["macos", "linux"]
# pane.agent_session and plugin pane --env are both available from 0.9.0.
min_herdr_version = "0.9.0"

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[panes]]
id = "picker"
title = "herdr-fork"
placement = "overlay"
command = ["./target/release/herdr-fork", "pick"]

[[actions]]
id = "fork"
title = "herdr-fork: fork conversation from a message"
description = "Pick one of your messages in the focused agent pane; a fork of the conversation from that point opens beside it."
contexts = ["pane", "workspace"]
command = ["./target/release/herdr-fork", "open"]

[[actions]]
id = "setup-keys"
title = "herdr-fork: install the prefix+shift+f keybinding"
description = "Append one marked block to your herdr config (backed up first) and reload it."
contexts = ["workspace"]
command = ["./target/release/herdr-fork", "setup-keys"]

[[actions]]
id = "remove-keys"
title = "herdr-fork: remove the keybinding"
description = "Delete the block setup-keys wrote."
contexts = ["workspace"]
command = ["./target/release/herdr-fork", "remove-keys"]
